# The backend accepts documents up to 100 MB. Keep the public proxy aligned so
# videos and other attachments are not rejected before the application can
# validate them for the selected WhatsApp provider.
client_max_body_size 100M;
client_body_timeout 5m;
send_timeout 5m;

server {
    index index.html;
    root /var/www/public/;

    server_name _;

    include include.d/realip.conf;

    include sites.d/frontend.conf;
}
