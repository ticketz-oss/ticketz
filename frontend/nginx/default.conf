server {
    listen 80;
    server_name _;
    client_max_body_size 50M;

    # Dedicated direct APK download endpoints
    location = /download {
        alias /usr/share/nginx/html/TicketzNeo.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="TicketzNeo.apk"';
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    location ~* \.apk$ {
        root /usr/share/nginx/html;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="TicketzNeo.apk"';
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # SPA routing for Vite frontend
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # WebSocket proxying
    location /socket.io/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend public uploaded media
    location /backend/public/ {
        alias /var/www/backend-public/;
        add_header Access-Control-Allow-Origin *;
        try_files $uri @proxy_backend;
    }

    # Backend REST API
    location /backend/ {
        rewrite ^/backend/(.*) /$1 break;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://backend:3000;
    }

    location @proxy_backend {
        rewrite ^/backend/(.*) /$1 break;
        proxy_pass http://backend:3000;
    }
}
