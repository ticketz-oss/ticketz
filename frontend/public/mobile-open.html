<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ff6b00" />
    <title>Abrir no Espaço Whats</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #fffaf6;
        color: #241b16;
      }
      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }
      main {
        width: min(100%, 420px);
        text-align: center;
      }
      img {
        width: 78px;
        height: 78px;
        border-radius: 22px;
        box-shadow: 0 18px 42px rgba(255, 107, 0, 0.2);
      }
      h1 {
        margin: 24px 0 8px;
        font-size: 28px;
      }
      p {
        color: #74665e;
        line-height: 1.5;
      }
      a {
        display: block;
        padding: 16px 20px;
        margin-top: 12px;
        border-radius: 16px;
        text-decoration: none;
        font-weight: 700;
      }
      #native {
        color: white;
        background: #ff6b00;
      }
      #browser {
        color: #8f3e00;
        background: rgba(255, 107, 0, 0.1);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          background: #160f0b;
          color: #fffaf6;
        }
        p {
          color: #bdaea5;
        }
        #browser {
          color: #ffb37d;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/branding/icon.png" alt="Espaço Whats" />
      <h1>Abrindo seu atendimento</h1>
      <p>
        O Espaço Whats será aberto no atendimento que gerou esta notificação.
      </p>
      <a id="native" href="/">Abrir Espaço Whats</a>
      <a id="browser" href="/">Continuar no navegador</a>
    </main>
    <script>
      (() => {
        const params = new URLSearchParams(window.location.search);
        const rawTicketId = params.get("ticketId") || "";
        const rawTicketUuid = params.get("ticketUuid") || "";
        const ticketId = /^\d{1,12}$/.test(rawTicketId) ? rawTicketId : "";
        const ticketUuid = /^[0-9a-f-]{16,64}$/i.test(rawTicketUuid)
          ? rawTicketUuid
          : "";
        const nativeURL = ticketId
          ? `espacowhats://ticket/${ticketId}`
          : "espacowhats://";
        const browserURL = ticketUuid
          ? `/tickets/${encodeURIComponent(ticketUuid)}`
          : "/tickets";

        document.getElementById("native").href = nativeURL;
        document.getElementById("browser").href = browserURL;
        window.location.replace(nativeURL);

        window.setTimeout(() => {
          if (document.visibilityState === "visible") {
            window.location.replace(browserURL);
          }
        }, 1600);
      })();
    </script>
  </body>
</html>
